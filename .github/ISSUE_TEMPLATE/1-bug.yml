name: Bug report / 問題回報
description: Something does not work as it should. / 程式的行為不正確。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please leave out personal information: folder names, user names and paths can be replaced with placeholders such as `D:\folder1`.
        感謝回報。請不要貼出個人資訊：資料夾名稱、使用者名稱和路徑可以改成 `D:\folder1` 這類代號。
  - type: input
    id: version
    attributes:
      label: DirSize version / DirSize 版本
      description: The file name of the installer you ran, or Properties > Details of dirsize.exe. / 執行的安裝檔檔名，或 dirsize.exe 的「內容 > 詳細資料」。
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with / 安裝方式
      options:
        - Installer (setup.exe) / 安裝程式
        - Portable zip / 免安裝版
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      description: Run `winver`. / 執行 `winver` 查看。
      placeholder: "Windows 11 24H2 (26100)"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where / 發生的地方
      multiple: true
      options:
        - Window / 獨立視窗
        - File Explorer panel / 檔案總管面板
        - Context menu / 右鍵選單
        - Service (sizes, indexing) / 服務（大小、索引）
        - Installer / 安裝程式
        - CLI (dirsize-cli.exe)
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / 發生了什麼
      description: Screenshots help. / 附截圖會很有幫助。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: What you expected / 預期的結果
  - type: input
    id: drive
    attributes:
      label: Drive and file system / 磁碟與檔案系統
      description: For example a local NTFS drive, exFAT USB drive or network drive. / 例如本機 NTFS、exFAT 隨身碟、網路磁碟。
